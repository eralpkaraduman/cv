<!doctype html>
<html>
<head>
  <meta charset=utf-8 />
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="media/style.css" type="text/css" rel="stylesheet">
</head>
<body class="markdown-body">
{% if site.shouldInjectCvDownloadLink != "NO" %}<div id="cv-header"><a class="download-button" href="https://github.com/{{ site.github.owner_name }}/{{ site.github.project_title }}/releases/latest/download/cv.pdf">Download as PDF</a></div>{% endif %}
{{ content }}
<hr>
<p class="cv-updated">Updated {{ site.time | date: "%B %-d %Y" }}. <a href="https://{{site.github.owner_name}}.github.io/{{site.github.project_title}}">Get latest</a></p>
</body>
</html>
