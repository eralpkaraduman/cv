<!doctype html>
<html lang="en">
<head>
  <meta charset=utf-8 />
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO / social / AI-agent metadata — sourced from index.md `jsonld` frontmatter -->
  {% assign ld = page.jsonld %}
  <meta name="description" content="{{ ld.description | strip_newlines | escape }}" />
  <meta name="author" content="{{ ld.name | escape }}" />
  <link rel="canonical" href="{{ ld.canonical }}" />
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="{{ page.title | escape }}" />
  <meta property="og:description" content="{{ ld.description | strip_newlines | escape }}" />
  <meta property="og:url" content="{{ ld.canonical }}" />
  <meta property="profile:first_name" content="{{ ld.name | split: ' ' | first | escape }}" />
  <meta property="profile:last_name" content="{{ ld.name | split: ' ' | last | escape }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ page.title | escape }}" />
  <meta name="twitter:description" content="{{ ld.description | strip_newlines | escape }}" />

  <!-- Machine-readable profile for CV parsers / AI agents.
       All values come from index.md `jsonld` frontmatter, so they can't drift from the CV. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ ld.name | jsonify }},
    "jobTitle": {{ ld.jobTitle | jsonify }},
    "description": {{ ld.description | strip_newlines | jsonify }},
    "email": "mailto:{{ ld.email }}",
    "url": {{ ld.url | jsonify }},
    "mainEntityOfPage": {{ ld.canonical | jsonify }},
    "worksFor": { "@type": "Organization", "name": {{ ld.employer | jsonify }} },
    "alumniOf": { "@type": "CollegeOrUniversity", "name": {{ ld.education | jsonify }} },
    "address": { "@type": "PostalAddress", "addressLocality": {{ ld.location.city | jsonify }}, "addressCountry": {{ ld.location.country | jsonify }} },
    "sameAs": {{ ld.sameAs | jsonify }},
    "knowsAbout": {{ ld.knowsAbout | jsonify }}
  }
  </script>

  <link href="media/style.css" type="text/css" rel="stylesheet">
  {% if site.shouldInjectCvDownloadLink != "NO" %}
  <!-- Umami analytics (config in _config.yml): web build only (excluded from the
       PDF); data-domains restricts collection to the live site so localhost isn't counted. -->
  <script defer src="{{ site.umami.src }}" data-website-id="{{ site.umami.website_id }}" data-domains="{{ site.umami.domains }}"></script>
  {% endif %}
</head>
<body class="markdown-body">
{% if site.shouldInjectCvDownloadLink != "NO" %}<div id="cv-header"><a class="download-button" data-umami-event="PDF Download" href="https://github.com/{{ site.github.owner_name }}/{{ site.github.project_title }}/releases/latest/download/cv.pdf">Download as PDF</a></div>{% endif %}
{{ content }}
<hr>
<p class="cv-updated">Updated {{ site.time | date: "%B %-d %Y" }}. <a href="https://{{site.github.owner_name}}.github.io/{{site.github.project_title}}">Get latest</a></p>
</body>
</html>
