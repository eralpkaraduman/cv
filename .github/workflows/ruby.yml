name: Build PDF and Release

on:
  push:
    branches: [ gh-pages ]

# Allow the default GITHUB_TOKEN to create tags/releases.
permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build the PDF inside the pinned image (Ruby 2.5 / Jekyll 3.7.4 / wkhtmltopdf).
      # build-pdf writes _site/cv.pdf with the download-link JS disabled.
      - name: Build PDF in Docker
        run: |
          docker build -t cv-jekyll .
          docker run --rm -v "$PWD":/cv cv-jekyll build-pdf

      - name: Compute release tag
        id: tag
        run: echo "value=v$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.value }}
          tag_name: ${{ steps.tag.outputs.value }}
          files: ./_site/cv.pdf
          # Ambient, auto-provisioned token for this run — no stored PAT/secret.
          token: ${{ github.token }}
