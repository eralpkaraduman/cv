name: Build PDF and Release

on:
  push:
    branches: [gh-pages]
    # The "publish PDF" step below commits the rebuilt PDF back to gh-pages.
    # Pushes made with GITHUB_TOKEN don't re-trigger workflows, but ignore the
    # path too so a manual `git push` of just the PDF can't start a loop either.
    paths-ignore:
      - 'Eralp-Karaduman-CV.pdf'

# Allow the default GITHUB_TOKEN to create tags/releases.
permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3

      # Build the pinned image (Ruby 2.5 / Jekyll 3.7.4 / wkhtmltopdf), caching layers in
      # the GitHub Actions cache so apt/bundle/pdfkit aren't reinstalled every run.
      # load: true keeps the image in the local daemon for the run step below.
      - name: Build image (cached)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # ratchet:docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cv-jekyll:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # build-pdf writes _pdfbuild/Eralp-Karaduman-CV.pdf with the download-link JS disabled.
      - name: Build PDF
        run: docker run --rm -v "$PWD":/cv cv-jekyll:latest build-pdf

      # Serve the PDF from the Pages site itself. Same origin as a page the
      # visitor already loaded, Content-Type: application/pdf, no attachment
      # disposition, so it previews inline instead of failing silently behind a
      # corporate proxy or a mobile in-app browser.
      - name: Publish PDF to the Pages site
        run: |
          set -e
          cp _pdfbuild/Eralp-Karaduman-CV.pdf ./Eralp-Karaduman-CV.pdf
          # --porcelain (not `git diff`) so an untracked file on the first run counts as a change.
          if [ -z "$(git status --porcelain -- Eralp-Karaduman-CV.pdf)" ]; then
            echo "PDF unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Eralp-Karaduman-CV.pdf
          git commit -m "Publish rebuilt CV PDF to the Pages site [skip ci]"
          git push origin HEAD:gh-pages

      - name: Compute release tag
        id: tag
        run: echo "value=v$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # ratchet:softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.value }}
          tag_name: ${{ steps.tag.outputs.value }}
          files: ./_pdfbuild/*.pdf
          # Ambient, auto-provisioned token for this run — no stored PAT/secret.
          token: ${{ github.token }}
